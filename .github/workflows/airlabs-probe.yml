name: AirLabs probe

# Manual, one-off: check what the free AirLabs key actually returns before the
# app depends on it. A handful of API requests per run.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Which probe to run
        type: choice
        default: schedules
        options:
          - schedules
          - routes

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check what the free key returns
        env:
          AIRLABS_KEY: ${{ secrets.AIRLABS_KEY }}
          PROBE: ${{ inputs.probe }}
        run: node scripts/probe-airlabs${{ inputs.probe == 'routes' && '-routes' || '' }}.mjs
