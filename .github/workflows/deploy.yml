name: Deploy

# Runs on every push, and on a schedule so the published flight-position
# snapshot stays reasonably current.
#
# GitHub's scheduled runs are best effort and are often delayed under load, so
# the app treats the snapshot as data that may be stale and labels it with its
# own timestamp rather than assuming it is fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Anonymous OpenSky request. If it fails the committed snapshot is used
      # instead, so a bad run never publishes an empty one.
      - name: Refresh flight position snapshot
        continue-on-error: true
        run: node scripts/fetch-flight-snapshot.mjs

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
