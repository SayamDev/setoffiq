name: Deploy

# Runs on every push, and on a schedule so the published flight-position
# snapshot stays reasonably current.
#
# GitHub's scheduled runs are best effort and are often delayed under load, so
# the app treats the snapshot as data that may be stale and labels it with its
# own timestamp rather than assuming it is fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Anonymous OpenSky request. If it fails the committed snapshot is used
      # instead, so a bad run never publishes an empty one.
      - name: Refresh flight position snapshot
        continue-on-error: true
        run: node scripts/fetch-flight-snapshot.mjs

      # Aerodrome observation. Free and keyless, but the Aviation Weather
      # Center sends no CORS header, so it is fetched here rather than in the
      # browser — the same pattern as the flight snapshot.
      - name: Refresh airport conditions snapshot
        continue-on-error: true
        run: node scripts/fetch-airport-conditions.mjs

      # ---------------------------------------------------------------------
      # Where a keyed source would go.
      #
      # A free API that requires registration is still usable, as long as the
      # key never reaches the browser. This job is the right place for it: the
      # key lives in repository secrets, the request happens here, and the
      # browser only ever reads the static JSON that results.
      #
      # National Highways' closures feed and the Street Manager roadworks API
      # both work this way. Neither is enabled, because neither has been
      # registered and their terms have not been verified against the £0 rule —
      # free registration is not the same as free at volume.
      #
      # To enable one: add the secret, drop the `if:` guard, and the app picks
      # up the extra file. Without it the recommendation is unchanged, just
      # without a road-disruption signal.
      #
      # - name: Refresh road disruption snapshot
      #   if: ${{ secrets.NATIONAL_HIGHWAYS_KEY != '' }}
      #   continue-on-error: true
      #   env:
      #     NATIONAL_HIGHWAYS_KEY: ${{ secrets.NATIONAL_HIGHWAYS_KEY }}
      #   run: node scripts/fetch-road-disruption.mjs

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
