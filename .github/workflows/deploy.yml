name: Deploy

# Runs on every push, and on a schedule so the published flight-position
# snapshot stays reasonably current.
#
# GitHub's scheduled runs are best effort and are often delayed under load, so
# the app treats the snapshot as data that may be stale and labels it with its
# own timestamp rather than assuming it is fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reported routes: the Virtual Radar Server standing data (CC0), about
      # 26 MB of CSV. Cloned at most once a day and cached between the
      # quarter-hourly runs; if a clone fails, yesterday's copy is kept.
      - name: Date for the route data cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: standing-data
        with:
          path: .cache/standing-data
          key: standing-data-${{ steps.day.outputs.day }}
          restore-keys: standing-data-

      - name: Refresh route data
        if: steps.standing-data.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          rm -rf .cache/standing-data.new
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/vradarserver/standing-data.git .cache/standing-data.new
          git -C .cache/standing-data.new sparse-checkout set routes/schema-01 airports/schema-01
          rm -rf .cache/standing-data
          mv .cache/standing-data.new .cache/standing-data

      # SetoffIQ's own record of arrivals. The published copy on the site is
      # the main one; this cache is a second, so one failed fetch of the live
      # file cannot reset two weeks of history. A new key every run, restored
      # from the most recent.
      - uses: actions/cache@v4
        with:
          path: .cache/history
          key: arrival-history-${{ github.run_id }}
          restore-keys: arrival-history-

      # Aircraft near the airport from adsb.lol (ODbL 1.0), keyless. If it
      # fails the committed snapshot is used instead, so a bad run never
      # publishes an empty one — and the app will not place aircraft from a
      # snapshot more than an hour old.
      - name: Refresh flight position snapshot
        continue-on-error: true
        env:
          STANDING_DATA_DIR: .cache/standing-data
          HISTORY_CACHE_FILE: .cache/history/EGCC-history.json
        run: node scripts/fetch-flight-snapshot.mjs

      # Aerodrome observation. Free and keyless, but the Aviation Weather
      # Center sends no CORS header, so it is fetched here rather than in the
      # browser — the same pattern as the flight snapshot.
      - name: Refresh airport conditions snapshot
        continue-on-error: true
        run: node scripts/fetch-airport-conditions.mjs

      # Road disruption. Every free UK source for this requires a registered
      # key, which is fine as long as the key stays here: it is read from a
      # repository secret, used in CI, and never reaches a browser. No visitor
      # is ever asked for a key or charged anything.
      #
      # With no secret set the script exits cleanly without writing a file, and
      # the app reports road disruption as "not checked" — so a fork without
      # the key is no worse off than the product was before it had one.
      - name: Refresh road disruption snapshot
        continue-on-error: true
        env:
          NATIONAL_HIGHWAYS_KEY: ${{ secrets.NATIONAL_HIGHWAYS_KEY }}
          ROAD_DISRUPTION_URL: ${{ vars.ROAD_DISRUPTION_URL }}
        run: node scripts/fetch-road-disruption.mjs

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
